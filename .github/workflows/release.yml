name: Release

# Cutting a release is one push: `wails3 task version:set VERSION=x.y.z`,
# commit, `git tag -a vx.y.z`, push the tag. This builds every platform, signs
# the update manifest and publishes the lot. docs/release.md is the long form.
#
# **This repository is private and stays private, and nothing here needs it not
# to be.** What ships goes to an S3-compatible bucket served under a domain of
# ours, which is also the address an installed copy asks — `updateManifestURL`
# in updates.go. No public repository, no token handed to users, and one
# address that can point wherever the files are kept next year.
#
# The tag's own annotation is the release notes — the text the application
# shows on its «Обновление» screen.
#
# Nothing here reimplements the build. The Taskfiles already know how to build
# and package this application on each platform, and the third-party Wails
# actions on the Marketplace are all v2: they know nothing about
# build/config.yml. Every build step below is `wails3 task …` with the runner
# set up around it.
#
# Every job is native to its platform, and that is not a preference: NSIS needs
# makensis and AppImage shells out to ldd.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and sign everything without publishing a release'
        type: boolean
        default: true

permissions:
  contents: read

env:
  # The module pins this version of Wails; the CLI has to match it, or the
  # build assets are generated by a tool that disagrees with the library.
  WAILS_VERSION: v3.0.0-beta.5

jobs:
  build:
    name: ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.runner }}
    strategy:
      # One platform failing must not throw away the others: the artifacts of
      # the jobs that did work are what a re-run does not have to redo.
      fail-fast: false
      matrix:
        target:
          - name: macOS arm64
            runner: macos-14
            platform: darwin
            arch: arm64
          - name: macOS amd64
            runner: macos-13
            platform: darwin
            arch: amd64
          - name: Windows amd64
            runner: windows-latest
            platform: windows
            arch: amd64
          - name: Linux amd64
            runner: ubuntu-latest
            platform: linux
            arch: amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # libghostty-vt, the terminal emulator the pty holder keeps screens in, is
      # built from Ghostty's source with Zig by the build itself
      # (common:ghostty:lib). On Windows Zig is the C compiler for cgo as well.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # The native terminal (internal/nativeterm) is Ghostty's own macOS
      # library, whose renderer is compiled with Xcode's Metal toolchain — a
      # component recent Xcodes download on demand.
      - name: Make sure the Metal toolchain is present
        if: matrix.target.platform == 'darwin'
        run: xcrun --find metal || xcodebuild -downloadComponent MetalToolchain

      - name: Install the Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      # The GTK 4 / WebKitGTK 6.0 stack, which is what build/linux/nfpm/nfpm.yaml
      # declares this application depends on.
      - name: Install the Linux build dependencies
        if: matrix.target.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      # cgo finds libghostty-vt through pkg-config, which the Windows runner
      # image does not promise.
      - name: Make sure pkg-config is present
        if: matrix.target.platform == 'windows'
        shell: bash
        run: command -v pkg-config || choco install pkgconfiglite -y --no-progress

      # The runner image ships NSIS, but a runner image is not a contract.
      - name: Make sure NSIS is present
        if: matrix.target.platform == 'windows'
        shell: bash
        run: command -v makensis || choco install nsis -y --no-progress

      - name: Install the frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Work out the version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^const appVersion = "\(.*\)"$/\1/p' version.go)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building ${version}"

      # A tag whose version does not match the tree's is a release that offers
      # every user an update to the version they are already running, for ever.
      # Cheaper to fail here than to hear it from them.
      - name: Check the tag against the version in the tree
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "${{ steps.version.outputs.version }}" ]; then
            echo "tag ${GITHUB_REF_NAME}, but version.go says ${{ steps.version.outputs.version }}" >&2
            echo "run: wails3 task version:set VERSION=${GITHUB_REF_NAME#v}" >&2
            exit 1
          fi

      # dist/update is what the updater installs; dist/install is what a person
      # downloads the first time. The manifest is generated over the first
      # directory alone — an installer swapped in as if it were the application
      # would replace XXVI with a copy of its own installer.
      - name: Make the output directories
        shell: bash
        run: mkdir -p dist/update dist/install

      # ── macOS ────────────────────────────────────────────────────────────
      # ditto, not zip: a .app is a bundle with symlinks and extended
      # attributes, and `zip -r` quietly flattens both. package:dmg builds the
      # bundle on the way, so this is one build and two artifacts out of it.
      - name: Build and package for macOS
        if: matrix.target.platform == 'darwin'
        run: |
          wails3 task darwin:package:dmg
          ditto -c -k --keepParent "bin/xxvi.app" \
            "dist/update/xxvi-${{ steps.version.outputs.version }}-darwin-${{ matrix.target.arch }}.zip"
          mv "bin/xxvi.dmg" \
            "dist/install/xxvi-${{ steps.version.outputs.version }}-darwin-${{ matrix.target.arch }}.dmg"

      # ── Windows ──────────────────────────────────────────────────────────
      # INSTALL_SCOPE=user rather than the Taskfile's default of machine: an
      # application installed into Program Files cannot replace its own .exe
      # without asking for administrator rights, so a machine-scope install is
      # one that can never update itself.
      - name: Build and package for Windows
        if: matrix.target.platform == 'windows'
        shell: bash
        run: |
          wails3 task windows:package INSTALL_SCOPE=user
          cp "bin/xxvi.exe" \
            "dist/update/xxvi-${{ steps.version.outputs.version }}-windows-${{ matrix.target.arch }}.exe"
          mv "bin/xxvi-${{ matrix.target.arch }}-installer.exe" \
            "dist/install/xxvi-${{ steps.version.outputs.version }}-windows-${{ matrix.target.arch }}-installer.exe"

      # ── Linux ────────────────────────────────────────────────────────────
      # The tar.gz is the updatable form: unpacked into a directory the user
      # owns, it can replace itself. A .deb installed into /usr cannot, which is
      # why it is offered for the first install and never to the updater.
      #
      # Only the AppImage and the deb are built. rpm and AUR are in the Taskfile
      # and are left out here: nobody has run them, and a release job is not the
      # place to find out.
      - name: Build and package for Linux
        if: matrix.target.platform == 'linux'
        run: |
          wails3 task linux:build
          tar -czf "dist/update/xxvi-${{ steps.version.outputs.version }}-linux-${{ matrix.target.arch }}.tar.gz" \
            -C bin xxvi
          wails3 task linux:create:appimage
          wails3 task linux:create:deb
          find bin -maxdepth 1 \( -name '*.AppImage' -o -name '*.deb' \) -exec mv {} dist/install/ \;

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target.platform }}-${{ matrix.target.arch }}
          path: dist
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install the Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      # Everything here comes out of the source. The feed address and the
      # channel are read from updates.go — the same two constants the built
      # binary asks with — so the address a release is published under and the
      # address an installed copy looks at cannot drift apart. They are one
      # `const` per line for exactly this sed.
      - name: Work out the version and the release address
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^const appVersion = "\(.*\)"$/\1/p' version.go)"
          manifest="$(sed -n 's/^const updateManifestURL = "\(.*\)"$/\1/p' updates.go)"
          channel="$(sed -n 's/^const updateChannel = "\(.*\)"$/\1/p' updates.go)"
          base="${manifest%/*}"
          if [ -z "${version}" ] || [ -z "${base}" ] || [ -z "${channel}" ]; then
            echo "could not read the version, the feed address or the channel out of the source" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "manifest_name=${manifest##*/}" >> "$GITHUB_OUTPUT"
          echo "manifest_url=${manifest}" >> "$GITHUB_OUTPUT"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          echo "url_prefix=${base}/v${version}/" >> "$GITHUB_OUTPUT"
          echo "publishing ${version} under ${base}/v${version}/"

      # The annotated tag's message. A lightweight tag, or a manual run, leaves
      # it empty and the release carries its version and nothing else — better
      # than a commit subject written for other developers.
      - name: Take the release notes from the tag
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" || true
            git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > notes.md
          fi
          if [ ! -s notes.md ]; then
            printf 'XXVI %s\n' "${{ steps.version.outputs.version }}" > notes.md
          fi
          cat notes.md

      # This is the whole trust chain. `manifest` digests every artifact and
      # signs it with the private half of build/updater.key.pub, which is
      # compiled into every binary this repository ships — so a manifest served
      # by anybody but us fails to verify inside the application.
      #
      # -url-prefix makes the artifact URLs absolute against this version's own
      # folder, which is what lets the manifest live at one unchanging address
      # while every release's files live at their own.
      - name: Sign the release manifest
        shell: bash
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
        run: |
          if [ -z "${UPDATER_PRIVATE_KEY}" ]; then
            echo "UPDATER_PRIVATE_KEY is not set — see docs/release.md" >&2
            exit 1
          fi
          printf '%s' "${UPDATER_PRIVATE_KEY}" > updater.key
          wails3 updater manifest \
            -version "${{ steps.version.outputs.version }}" \
            -channel "${{ steps.version.outputs.channel }}" \
            -key updater.key \
            -notes-file notes.md \
            -url-prefix "${{ steps.version.outputs.url_prefix }}" \
            -output dist/manifest.json \
            dist/update/
          rm -f updater.key

      # The gate: verifying against the *tracked* public key proves the release
      # was signed with the key the shipped binaries trust. A mismatch here is
      # an update nobody could install, caught before it is published.
      # -dir explicitly: verify defaults to the manifest's own directory, and
      # the manifest is written a level above the files it describes.
      - name: Verify the manifest against the key the app is built with
        run: wails3 updater verify -manifest dist/manifest.json -publickey build/updater.key.pub -dir dist/update

      - name: Show what would be published
        shell: bash
        run: |
          ls -l dist/update dist/install
          cat dist/manifest.json

      # S3-compatible, so the same lines work against Cloudflare R2, Backblaze
      # B2 or plain S3; only the endpoint changes. The AWS CLI ships on the
      # runner.
      #
      # **The files go up before the manifest, and that ordering is the point.**
      # The manifest is what says a release exists; publishing it first opens a
      # window in which every application that checks downloads a 404 and shows
      # a failed update for a release that is fine.
      #
      # Cache-Control likewise: the artifacts are immutable under a versioned
      # path and may be cached for ever, but a manifest cached for hours is a
      # release nobody sees until the CDN feels like it.
      - name: Publish
        if: github.ref_type == 'tag' && inputs.dry_run != true
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.RELEASES_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASES_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT: ${{ secrets.RELEASES_S3_ENDPOINT }}
          BUCKET: ${{ secrets.RELEASES_S3_BUCKET }}
        run: |
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY ENDPOINT BUCKET; do
            if [ -z "${!name}" ]; then
              echo "${name} is not set — see docs/release.md" >&2
              exit 1
            fi
          done
          version="${{ steps.version.outputs.version }}"

          aws s3 sync dist/update "s3://${BUCKET}/v${version}/" \
            --endpoint-url "${ENDPOINT}" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist/install "s3://${BUCKET}/v${version}/" \
            --endpoint-url "${ENDPOINT}" \
            --cache-control "public, max-age=31536000, immutable"

          aws s3 cp dist/manifest.json "s3://${BUCKET}/${{ steps.version.outputs.manifest_name }}" \
            --endpoint-url "${ENDPOINT}" \
            --content-type application/json \
            --cache-control "public, max-age=300"

      # Proof that an installed application would now find this release, made
      # the same way one does: fetch the address compiled into the binary and
      # check it against the same public key. A bucket whose custom domain is
      # not wired up yet fails here rather than in somebody's application.
      - name: Check the published feed the way the app reads it
        if: github.ref_type == 'tag' && inputs.dry_run != true
        shell: bash
        run: |
          manifest="${{ steps.version.outputs.manifest_url }}"
          for attempt in 1 2 3 4 5; do
            if curl -fsS "${manifest}" -o published.json; then break; fi
            echo "not there yet (attempt ${attempt})"; sleep 10
          done
          # Against the files this run built: proves the manifest now being
          # served is the one that was signed here, describing these bytes.
          wails3 updater verify -manifest published.json -publickey build/updater.key.pub -dir dist/update
          # And that the artifacts it points at are actually reachable — a
          # bucket whose public access or custom domain is not wired up serves
          # the manifest from cache and 403s every download.
          for url in $(grep -oE 'https://[^"]+' published.json); do
            curl -fsSI "${url}" > /dev/null || { echo "unreachable: ${url}" >&2; exit 1; }
          done
